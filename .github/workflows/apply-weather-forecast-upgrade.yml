name: Apply weather forecast upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-weather-forecast-upgrade.yml'
      - 'scripts/apply_weather_forecast_upgrade.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply upgrade
        run: python scripts/apply_weather_forecast_upgrade.py
      - name: Refresh weather snapshot now
        run: |
          PYTHONPATH=scripts python scripts/update_official_web_content_fast.py
      - name: Validate
        run: |
          python -m py_compile scripts/update_official_web_content.py scripts/update_official_web_content_fast.py
          node --check stable-tools.js
          python -m json.tool trip-live.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('trip-live.json',encoding='utf-8'))
          assert len(p.get('weather',{})) == 11
          assert any(loc.get('model_daily') for day in p['weather'].values() for loc in day.get('locations',[]))
          assert any(loc.get('city') == 'Aarhus' for loc in p['weather']['2026-09-10']['locations'])
          assert p['weather']['2026-09-02']['locations'][0].get('forecast_confidence')
          PY
          grep -q 'Open-Meteo 16-day numerical guidance' scripts/update_official_web_content_fast.py
          grep -q 'modelWeatherArticle' stable-tools.js
      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/update_official_web_content.py scripts/update_official_web_content_fast.py stable-tools.js trip-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat: show live trip weather forecasts with confidence'
            git push
          fi
