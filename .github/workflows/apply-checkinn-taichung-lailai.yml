name: Apply CHECK Inn Taichung LaiLai booking

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-checkinn-taichung-lailai.yml'
      - 'scripts/apply_checkinn_taichung_lailai.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply booked Taichung hotel and route update
        run: python3 scripts/apply_checkinn_taichung_lailai.py
      - name: Validate JavaScript and route mappings
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          cp timeline-runtime-v17.js /tmp/timeline-runtime-v17.mjs
          node --check /tmp/itinerary-data.mjs
          node --check /tmp/timeline-runtime-v17.mjs
          node --check map-routing.mjs
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node scripts/audit_map_continuity.mjs itinerary-data.js
      - name: Verify booking facts
        run: |
          grep -q 'CHECK Inn Taichung LaiLai' itinerary-data.js
          grep -q '16:00 이후 체크인' itinerary-data.js
          grep -q '11:00 이전 체크아웃' itinerary-data.js
          grep -q 'No.125, Sec. 3, Sanmin Rd.' itinerary-data.js
          grep -q '"d3-00"' itinerary-data.js
          grep -q '호텔 짐 회수' itinerary-data.js
          ! grep -q 'Holiday Inn Express Taichung Park' itinerary-data.js
          ! grep -q 'Holiday Inn Express Taichung Park' map-routing.mjs
      - name: Commit booking update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-data.js map-routing.mjs timeline-runtime-v17.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat: use booked CHECK Inn Taichung LaiLai'
            git push
          fi
