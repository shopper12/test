name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh official transit snapshot for artifact
        run: python scripts/update_transit_live.py

      - name: Validate FINAL_0830 itinerary, companion guide and maps
        shell: bash
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          python - <<'PY'
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          boot=Path('boot.js').read_text(encoding='utf-8')
          itinerary=Path('itinerary-data.js').read_text(encoding='utf-8')
          study=Path('travel-study.js').read_text(encoding='utf-8')
          companion=Path('trip-companion-data.js').read_text(encoding='utf-8')
          companion_runtime=Path('trip-companion-runtime.js').read_text(encoding='utf-8')
          stable=Path('stable-tools.js').read_text(encoding='utf-8')
          routing=Path('map-routing.mjs').read_text(encoding='utf-8')
          timeline=Path('timeline-runtime-v17.js').read_text(encoding='utf-8')
          assert 'FINAL_0830_V1' in html and 'FINAL_0830_V1' in boot
          assert 'FINAL_0830_V1' in itinerary and 'final_0830' in itinerary
          assert '2026_해외_해상풍력_벤치마킹_통합일정표_0830_교통편반영.docx' in itinerary
          assert 'travelers:3' in itinerary
          assert 'trip-companion-runtime.js?v=FINAL_0830_V3' in html
          assert 'trip-companion.css?v=FINAL_0830_V3' in html
          assert 'travel-study.css?v=FINAL_0830_V2' in html
          assert 'WEATHER_BY_DAY' in study and 'STUDY_PLACES' in study
          assert 'PRACTICAL_DAYS' in companion and 'TRANSPORT_GUIDE' in companion
          assert 'RESTAURANTS' in companion and 'ATTRACTIONS' in companion
          assert 'REPORT_MEMOS' in companion and 'REPORT_OUTLINE' in companion
          assert '🧭 현지가이드' in companion_runtime
          assert '📝 보고서 메모' in companion_runtime
          assert '🎬 여행공부' in companion_runtime
          assert 'IC 2337' in companion and '11:03~13:08' in companion
          assert 'IC 460' in companion and '17:50~19:54' in companion
          assert 'EBJ → ABZ' in itinerary or 'EBJ' in itinerary
          assert 'timeline-runtime-v17.js' in boot
          assert 'map-sidebar-group' in stable and 'flightRoutePoints' in stable
          assert 'MAP_MANIFEST' in routing and 'manifestCoverage' in routing
          assert 'data-v16-map' in timeline and '__openDashboardMapEvent' in timeline
          f=json.load(open('flight-prices.json',encoding='utf-8'))
          assert f.get('passengers') == 3
          assert f.get('fares') == {}
          t=json.load(open('transit-live.json',encoding='utf-8'))
          assert len(t.get('providers',[])) == 9
          PY
          node --check map-routing.mjs
          node --check stable-tools.js
          node --check timeline-runtime-v17.js
          node --check boot.js
          node --check app.js
          node --check travel-study.js
          node --check trip-companion-data.js
          node --check trip-companion-runtime.js
          node --check unified-experience.js
          node --check travel-live.js
          node --check google-maps-inline.js
          node --check scripts/verify_map_mappings.mjs
          node --check scripts/audit_map_continuity.mjs
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node scripts/audit_map_continuity.mjs itinerary-data.js
          python -m py_compile scripts/update_flight_prices.py scripts/update_transit_live.py
          python -m json.tool flight-prices.json >/dev/null
          python -m json.tool trip-live.json >/dev/null
          python -m json.tool transit-live.json >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
