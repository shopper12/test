name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dashboard source
        shell: bash
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          python - <<'PY'
          from pathlib import Path
          text = Path('app.js').read_text(encoding='utf-8')
          text = text.replace('"./itinerary-data.js?v=PDF_ROUTE_COST_OPTIMIZED_V2"', '"./itinerary-data.mjs"')
          Path('/tmp/app.mjs').write_text(text, encoding='utf-8')
          stable = Path('stable-tools.js').read_text(encoding='utf-8')
          assert 'mainObserver.observe(main,{childList:true,subtree:false})' in stable
          assert 'document.addEventListener("pointerup"' in stable
          assert 'window.__tripMapFocus=focusMap' in stable
          assert 'mainObserver.observe(main,{childList:true,subtree:true})' not in stable
          PY
          node --check /tmp/itinerary-data.mjs
          node --check /tmp/app.mjs
          node --check boot.js
          node --check stable-tools.js
          node --check unified-experience.js
          node --check weather-fallback.js
          grep -q 'LIVE_TRAVEL_V13' index.html
          grep -q 'LIVE_TRAVEL_V13' boot.js
          grep -q 'stable-tools.js' boot.js
          grep -q 'id="stable-live-tools"' index.html
          grep -q 'derivedRoute' stable-tools.js
          grep -q 'Google Flights 최저가 비교' unified-experience.js
          grep -q 'Google Hotels 최저가 비교' unified-experience.js
          grep -q 'button.textContent="전체 일정"' unified-nav.js
          grep -q 'AccuWeather 2026년 9월 월간전망 평균' weather-fallback.js
          python -m py_compile scripts/update_flight_prices.py
          python -m json.tool flight-prices.json >/dev/null
          python -m json.tool trip-live.json >/dev/null
          test "$(python -c 'import json; print(len(json.load(open("flight-prices.json"))["fares"]))')" = "8"
          test "$(python -c 'import json; print(len(json.load(open("trip-live.json"))["weather"]))')" = "11"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
