name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dashboard source
        shell: bash
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          python - <<'PY'
          from pathlib import Path
          text = Path('app.js').read_text(encoding='utf-8')
          text = text.replace('"./itinerary-data.js"', '"./itinerary-data.mjs"')
          Path('/tmp/app.mjs').write_text(text, encoding='utf-8')
          PY
          node --check /tmp/itinerary-data.mjs
          node --check /tmp/app.mjs
          node --check boot.js
          python -m py_compile scripts/update_flight_prices.py
          python -m json.tool flight-prices.json >/dev/null
          test "$(python -c 'import json; print(len(json.load(open("flight-prices.json"))["fares"]))')" = "5"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
