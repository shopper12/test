name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dashboard source and every map event
        shell: bash
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          python - <<'PY'
          from pathlib import Path
          stable=Path('stable-tools.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          boot=Path('boot.js').read_text(encoding='utf-8')
          css=Path('map-sidebar.css').read_text(encoding='utf-8')
          assert 'LIVE_TRAVEL_V14' in boot and 'LIVE_TRAVEL_V14' in html
          assert 'map-routing.mjs' in stable
          assert 'map-sidebar.css?v=LIVE_TRAVEL_V14' in html
          assert 'if(tab==="map"){h.hidden=true;h.innerHTML="";scheduleMapSidebar();return;}' in stable
          assert '#route-list [data-stable-map-event]' in stable
          assert 'map-schedule-sidebar-item' in stable and 'map-schedule-sidebar-item' in css
          assert 'window.__tripMapAudit' in stable and 'window.__tripMapFocus' in stable
          assert 'mainObserver.observe(main,{childList:true,subtree:false})' in stable
          assert '#main-content .map-schedule-section{display:none!important}' in css
          PY
          node --check map-routing.mjs
          node --check stable-tools.js
          node --check boot.js
          node --check scripts/verify_map_mappings.mjs
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node --check unified-experience.js
          node --check weather-fallback.js
          grep -q 'Google Flights 최저가 비교' unified-experience.js
          grep -q 'Google Hotels 최저가 비교' unified-experience.js
          grep -q 'button.textContent="전체 일정"' unified-nav.js
          python -m py_compile scripts/update_flight_prices.py
          python -m json.tool flight-prices.json >/dev/null
          python -m json.tool trip-live.json >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
