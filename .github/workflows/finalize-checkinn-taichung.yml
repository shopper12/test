name: Finalize CHECK Inn Taichung consistency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-checkinn-taichung.yml'
      - 'scripts/finalize_checkinn_taichung.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/finalize_checkinn_taichung.py
      - name: Validate
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          node --check /tmp/itinerary-data.mjs
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node scripts/audit_map_continuity.mjs itinerary-data.js
          grep -q 'name: "CHECK Inn Taichung LaiLai"' itinerary-data.js
          grep -q '"3시간 5분"' itinerary-data.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-data.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: align Taichung checkout route duration'
            git push
          fi
