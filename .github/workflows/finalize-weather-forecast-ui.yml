name: Finalize weather forecast UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-weather-forecast-ui.yml'
      - 'scripts/finalize_weather_forecast_ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/finalize_weather_forecast_ui.py
      - name: Refresh weather
        run: PYTHONPATH=scripts python scripts/update_official_web_content_fast.py
      - name: Validate
        run: |
          python -m py_compile scripts/update_official_web_content.py
          node --check stable-tools.js
          python -m json.tool trip-live.json >/dev/null
          grep -q 'weatherImpact' stable-tools.js
          grep -q '일정 영향' stable-tools.js
          python - <<'PY'
          import json
          p=json.load(open('trip-live.json',encoding='utf-8'))
          loc=p['weather']['2026-09-11']['locations'][0]
          m=loc.get('model_daily')
          if m:
              core=[m.get(k) for k in ('weather_code','temperature_max_c','temperature_min_c','precip_probability_max_pct','precipitation_sum_mm','wind_speed_max_kmh','wind_gusts_max_kmh')]
              assert any(v is not None for v in core)
          assert p['weather']['2026-09-02']['locations'][0]['model_daily']['precip_probability_max_pct'] is not None
          PY
      - name: Commit final weather UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/update_official_web_content.py stable-tools.js trip-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add weather impact guidance to trip days'
            git push
          fi
