name: Fix final 0830 app runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-final-0830-app-runtime.yml'
      - 'scripts/fix_final_0830_app_runtime.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_final_0830_app_runtime.py
      - name: Validate runtime references
        run: |
          node --check app.js
          node --check itinerary-data.js
          node --check report-memo.js
          node --check map-routing.mjs
          grep -q 'function renderRestaurants' app.js
          grep -q 'function renderDataSection' app.js
          grep -q 'FINAL_0830_V1' itinerary-data.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: restore final itinerary table runtime'
            git push
          fi
