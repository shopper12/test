name: Apply precise transport schedules

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-schedule-precision.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply schedule precision patch
        run: |
          python scripts/repair_schedule_patch.py
          python scripts/apply_schedule_precision.py
      - name: Validate JavaScript and schedule data
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          node --check itinerary-data.js
          node --check stable-tools.js
          node --check timeline-runtime-v17.js
          grep -q 'THSR 0826' itinerary-data.js
          grep -q 'WaterShuttle' itinerary-data.js
          grep -q 'ECE 396' itinerary-data.js
          grep -q 'DSB IC 850' itinerary-data.js
          grep -q 'transport-schedule' stable-tools.js
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node scripts/audit_map_continuity.mjs itinerary-data.js
      - name: Commit precise schedule UI
        run: |
          if git diff --quiet -- itinerary-data.js stable-tools.js timeline-runtime-v17.js map-sidebar.css live-transit-links.css; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itinerary-data.js stable-tools.js timeline-runtime-v17.js map-sidebar.css live-transit-links.css
          git commit -m "feat: show precise flight ferry and rail schedules"
          git push
