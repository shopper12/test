name: Apply precise transport schedules

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-schedule-precision.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final timing consistency fixes
        run: python scripts/finalize_schedule_precision.py
      - name: Validate exact transport schedules and maps
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          node --check itinerary-data.js
          node --check stable-tools.js
          node --check timeline-runtime-v17.js
          grep -q 'AF1751 + AF264' itinerary-data.js
          grep -q 'Re 1116 후보' itinerary-data.js
          grep -q 'Re 1026 후보' itinerary-data.js
          grep -q '23:16' itinerary-data.js
          grep -q 'THSR 0826' itinerary-data.js
          grep -q 'WaterShuttle' itinerary-data.js
          grep -q 'ECE 396' itinerary-data.js
          grep -q 'DSB IC 850' itinerary-data.js
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node scripts/audit_map_continuity.mjs itinerary-data.js
      - name: Commit final exact transport times
        run: |
          if git diff --quiet -- itinerary-data.js; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itinerary-data.js
          git commit -m "fix: align transport times with published schedules"
          git push
