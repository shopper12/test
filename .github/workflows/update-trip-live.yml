name: Update live trip intelligence

on:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_trip_live.py"
      - "scripts/update_flight_prices.py"
      - "scripts/refine_trip_photos.py"
      - "scripts/update_official_web_content.py"
      - "scripts/update_official_web_content_fast.py"
      - "scripts/fill_official_photo_images.py"
      - "scripts/verify_map_mappings.mjs"
      - "travel-live.js"
      - "unified-nav.js"
      - "unified-experience.js"
      - "unified-experience.css"
      - "stable-tools.js"
      - "stable-tools.css"
      - "map-routing.mjs"
      - "map-sidebar.css"
      - "weather-fallback.js"
      - "google-map-link-bridge.js"
      - "travel-live.css"
      - "google-maps-inline.css"
      - "index.html"
      - "boot.js"
      - ".github/workflows/update-trip-live.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-trip-intelligence-v14
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fare reader
        run: python -m pip install "fast-flights==3.0.1" "typing-extensions>=4.12,<5"

      - name: Syntax checks
        run: |
          python -m py_compile scripts/update_trip_live.py scripts/update_flight_prices.py scripts/refine_trip_photos.py scripts/update_official_web_content.py scripts/update_official_web_content_fast.py scripts/fill_official_photo_images.py
          node --check boot.js
          node --check travel-live.js
          node --check unified-nav.js
          node --check unified-experience.js
          node --check stable-tools.js
          node --check map-routing.mjs
          node --check scripts/verify_map_mappings.mjs
          node --check weather-fallback.js
          node --check google-map-link-bridge.js

      - name: Validate v14 right sidebar and every itinerary mapping
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          python - <<'PY'
          from pathlib import Path
          stable=Path('stable-tools.js').read_text(encoding='utf-8')
          css=Path('map-sidebar.css').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          boot=Path('boot.js').read_text(encoding='utf-8')
          assert 'LIVE_TRAVEL_V14' in boot and 'LIVE_TRAVEL_V14' in html
          assert 'map-routing.mjs' in stable
          assert 'map-sidebar.css?v=LIVE_TRAVEL_V14' in html
          assert 'if(tab==="map"){h.hidden=true;h.innerHTML="";scheduleMapSidebar();return;}' in stable
          assert '#route-list [data-stable-map-event]' in stable
          assert 'map-schedule-sidebar-item' in stable and 'map-schedule-sidebar-item' in css
          assert 'window.__tripMapAudit' in stable and 'window.__tripMapFocus' in stable
          assert '#main-content .map-schedule-section{display:none!important}' in css
          assert 'mainObserver.observe(main,{childList:true,subtree:false})' in stable
          PY

      - name: Refresh fares, stopover and legacy snapshot
        run: |
          python scripts/update_trip_live.py
          python scripts/refine_trip_photos.py

      - name: Replace weather and photos with official web sources
        run: |
          python scripts/update_official_web_content_fast.py
          python scripts/fill_official_photo_images.py

      - name: Validate live snapshot
        run: |
          python -m json.tool trip-live.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('trip-live.json',encoding='utf-8'))
          assert len(p['weather']) == 11
          assert 'return_stopover' in p
          assert p.get('schema_version', 0) >= 5
          assert len(p.get('photos', {})) >= 25
          assert all(photo.get('source') == 'official_website' for photo in p['photos'].values())
          assert sum(bool(photo.get('url')) for photo in p['photos'].values()) >= 19
          assert not any('wikimedia' in (photo.get('url','')+photo.get('page_url','')).lower() for photo in p['photos'].values())
          allowed={'Central Weather Administration (CWA)','KNMI','Deutscher Wetterdienst (DWD)','Danish Meteorological Institute (DMI)','Korea Meteorological Administration (KMA)'}
          for day in p['weather'].values():
              assert day.get('kind') == 'official_weather_bundle'
              for loc in day.get('locations',[]):
                  assert loc.get('authority') in allowed
                  assert loc.get('kind') in {'official_pending','official_hourly','official_unparsed','official_source_error'}
          PY

      - name: Commit refreshed snapshot safely
        run: |
          if git diff --quiet -- trip-live.json; then
            echo "No live changes"
            exit 0
          fi
          cp trip-live.json /tmp/trip-live.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/trip-live.json trip-live.json
            git add trip-live.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: refresh official trip intelligence"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify deployed build
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          grep -q 'LIVE_TRAVEL_V14' index.html
          grep -q 'LIVE_TRAVEL_V14' boot.js
          grep -q 'map-routing.mjs' stable-tools.js
          grep -q 'map-sidebar.css?v=LIVE_TRAVEL_V14' index.html
          grep -q '#route-list \[data-stable-map-event\]' stable-tools.js
          grep -q 'window.__tripMapAudit' stable-tools.js
          grep -q 'button.textContent="전체 일정"' unified-nav.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
