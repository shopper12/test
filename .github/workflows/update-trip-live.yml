name: Update live trip intelligence

on:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_trip_live.py"
      - "scripts/refine_trip_photos.py"
      - "scripts/update_official_web_content.py"
      - "scripts/update_official_web_content_fast.py"
      - "scripts/fill_official_photo_images.py"
      - "travel-live.js"
      - "unified-nav.js"
      - "unified-experience.js"
      - "unified-experience.css"
      - "stable-tools.js"
      - "stable-tools.css"
      - "weather-fallback.js"
      - "google-map-link-bridge.js"
      - "travel-live.css"
      - "google-maps-inline.css"
      - "index.html"
      - "boot.js"
      - ".github/workflows/update-trip-live.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-trip-intelligence-v12
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fare reader
        run: python -m pip install "fast-flights==3.0.1" "typing-extensions>=4.12,<5"

      - name: Syntax checks
        run: |
          python -m py_compile scripts/update_trip_live.py scripts/update_flight_prices.py scripts/refine_trip_photos.py scripts/update_official_web_content.py scripts/update_official_web_content_fast.py scripts/fill_official_photo_images.py
          node --check boot.js
          node --check travel-live.js
          node --check unified-nav.js
          node --check unified-experience.js
          node --check stable-tools.js
          node --check weather-fallback.js
          node --check google-map-link-bridge.js

      - name: Validate v12 integrated itinerary behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          stable=Path('stable-tools.js').read_text(encoding='utf-8')
          unified=Path('unified-experience.js').read_text(encoding='utf-8')
          nav=Path('unified-nav.js').read_text(encoding='utf-8')
          weather=Path('weather-fallback.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          boot=Path('boot.js').read_text(encoding='utf-8')
          assert 'LIVE_TRAVEL_V12' in boot and 'LIVE_TRAVEL_V12' in html
          assert 'stable-tools.js' in boot
          assert 'weather-fallback.js' in stable and 'weather-fallback.js' in unified
          assert 'id="stable-live-tools"' in html
          assert 'derivedRoute' in stable
          assert 'saddr' in stable and 'daddr' in stable and 'output:"embed"' in stable
          assert '경로 보기' in stable
          assert 'hotelsHtml' not in stable and 'Booking.com 실제 예약' not in stable
          assert 'Google Flights 최저가 비교' in unified
          assert 'Skyscanner 교차비교' in unified
          assert 'Google Hotels 최저가 비교' in unified
          assert 'dailyBoardHtml' not in unified
          assert 'document.querySelectorAll(".unified-day-board").forEach(el=>el.remove())' in unified
          assert 'button.textContent="전체 일정"' in nav
          assert 'AccuWeather 2026년 9월 월간전망 평균' in weather
          assert 'DMI 7일 예보' in weather
          assert 'KMA 1개월 전망' in weather
          PY

      - name: Refresh fares, stopover and legacy snapshot
        run: |
          python scripts/update_trip_live.py
          python scripts/refine_trip_photos.py

      - name: Replace weather and photos with official web sources
        run: |
          python scripts/update_official_web_content_fast.py
          python scripts/fill_official_photo_images.py

      - name: Validate live snapshot
        run: |
          python -m json.tool trip-live.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('trip-live.json',encoding='utf-8'))
          assert len(p['weather']) == 11
          assert 'return_stopover' in p
          assert p.get('schema_version', 0) >= 5
          assert len(p.get('photos', {})) >= 25
          assert all(photo.get('source') == 'official_website' for photo in p['photos'].values())
          assert sum(bool(photo.get('url')) for photo in p['photos'].values()) >= 19
          assert not any('wikimedia' in (photo.get('url','')+photo.get('page_url','')).lower() for photo in p['photos'].values())
          allowed={'Central Weather Administration (CWA)','KNMI','Deutscher Wetterdienst (DWD)','Danish Meteorological Institute (DMI)','Korea Meteorological Administration (KMA)'}
          for day in p['weather'].values():
              assert day.get('kind') == 'official_weather_bundle'
              for loc in day.get('locations',[]):
                  assert loc.get('authority') in allowed
                  assert loc.get('kind') in {'official_pending','official_hourly','official_unparsed','official_source_error'}
          PY

      - name: Commit refreshed snapshot safely
        run: |
          if git diff --quiet -- trip-live.json; then
            echo "No live changes"
            exit 0
          fi
          cp trip-live.json /tmp/trip-live.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "snapshot push attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/trip-live.json trip-live.json
            git add trip-live.json
            if git diff --cached --quiet; then
              echo "Remote already contains equivalent snapshot"
              exit 0
            fi
            git commit -m "chore: refresh official trip intelligence"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to publish generated snapshot after retries" >&2
          exit 1

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify deployed build
        run: |
          grep -q 'LIVE_TRAVEL_V12' index.html
          grep -q 'LIVE_TRAVEL_V12' boot.js
          grep -q 'weather-fallback.js' unified-experience.js
          grep -q 'Google Flights 최저가 비교' unified-experience.js
          grep -q 'Google Hotels 최저가 비교' unified-experience.js
          grep -q 'derivedRoute' stable-tools.js
          grep -q 'button.textContent="전체 일정"' unified-nav.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4