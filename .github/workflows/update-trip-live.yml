name: Update live trip intelligence

on:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_trip_live.py"
      - "scripts/update_flight_prices.py"
      - "scripts/update_transit_live.py"
      - "scripts/refine_trip_photos.py"
      - "scripts/update_official_web_content.py"
      - "scripts/update_official_web_content_fast.py"
      - "scripts/fill_official_photo_images.py"
      - "scripts/verify_map_mappings.mjs"
      - "scripts/audit_map_continuity.mjs"
      - "travel-live.js"
      - "live-transit-links.js"
      - "live-transit-links.css"
      - "transit-live.json"
      - "unified-nav.js"
      - "unified-experience.js"
      - "unified-experience.css"
      - "stable-tools.js"
      - "stable-tools.css"
      - "map-routing.mjs"
      - "map-sidebar.css"
      - "weather-fallback.js"
      - "google-map-link-bridge.js"
      - "travel-live.css"
      - "google-maps-inline.css"
      - "index.html"
      - "boot.js"
      - ".github/workflows/update-trip-live.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-trip-intelligence-v15
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fare reader
        run: python -m pip install "fast-flights==3.0.1" "typing-extensions>=4.12,<5"

      - name: Syntax checks
        run: |
          python -m py_compile scripts/update_trip_live.py scripts/update_flight_prices.py scripts/update_transit_live.py scripts/refine_trip_photos.py scripts/update_official_web_content.py scripts/update_official_web_content_fast.py scripts/fill_official_photo_images.py
          node --check boot.js
          node --check travel-live.js
          node --check live-transit-links.js
          node --check unified-nav.js
          node --check unified-experience.js
          node --check stable-tools.js
          node --check map-routing.mjs
          node --check scripts/verify_map_mappings.mjs
          node --check scripts/audit_map_continuity.mjs
          node --check weather-fallback.js
          node --check google-map-link-bridge.js

      - name: Validate v15 map mapping and continuous joins
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node scripts/audit_map_continuity.mjs itinerary-data.js
          python - <<'PY'
          from pathlib import Path
          stable=Path('stable-tools.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          boot=Path('boot.js').read_text(encoding='utf-8')
          live=Path('live-transit-links.js').read_text(encoding='utf-8')
          routing=Path('map-routing.mjs').read_text(encoding='utf-8')
          assert 'LIVE_TRAVEL_V15' in boot and 'LIVE_TRAVEL_V15' in html
          assert 'live-transit-links' in boot and 'transit-live.json' in live
          assert 'auditRouteContinuity' in stable and 'window.__tripMapContinuityAudit' in stable
          assert 'derived_from_map_place' in routing and 'continuity_' in routing
          assert 'entity-name-link hotel' in live and 'entity-name-link restaurant' in live
          assert 'mainObserver.observe(main,{childList:true,subtree:false})' in stable
          PY

      - name: Refresh fares, stopover and legacy snapshot
        run: |
          python scripts/update_trip_live.py
          python scripts/refine_trip_photos.py

      - name: Refresh official public transport status
        run: python scripts/update_transit_live.py

      - name: Replace weather and photos with official web sources
        run: |
          python scripts/update_official_web_content_fast.py
          python scripts/fill_official_photo_images.py

      - name: Validate live snapshots
        run: |
          python -m json.tool trip-live.json >/dev/null
          python -m json.tool transit-live.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('trip-live.json',encoding='utf-8'))
          assert len(p['weather']) == 11
          assert 'return_stopover' in p
          assert p.get('schema_version', 0) >= 5
          assert len(p.get('photos', {})) >= 25
          assert all(photo.get('source') == 'official_website' for photo in p['photos'].values())
          assert sum(bool(photo.get('url')) for photo in p['photos'].values()) >= 19
          assert not any('wikimedia' in (photo.get('url','')+photo.get('page_url','')).lower() for photo in p['photos'].values())
          allowed={'Central Weather Administration (CWA)','KNMI','Deutscher Wetterdienst (DWD)','Danish Meteorological Institute (DMI)','Korea Meteorological Administration (KMA)'}
          for day in p['weather'].values():
              assert day.get('kind') == 'official_weather_bundle'
              for loc in day.get('locations',[]):
                  assert loc.get('authority') in allowed
                  assert loc.get('kind') in {'official_pending','official_hourly','official_unparsed','official_source_error'}
          t=json.load(open('transit-live.json',encoding='utf-8'))
          assert t.get('generated_at')
          assert len(t.get('providers',[])) == 7
          assert all(x.get('official') is True for x in t['providers'])
          assert {x['id'] for x in t['providers']} == {'thsr','taoyuan_mrt','ns','db','hvv','dsb','rejseplanen'}
          PY

      - name: Commit refreshed snapshots safely
        run: |
          if git diff --quiet -- trip-live.json transit-live.json; then
            echo "No live changes"
            exit 0
          fi
          cp trip-live.json /tmp/trip-live.json
          cp transit-live.json /tmp/transit-live.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/trip-live.json trip-live.json
            cp /tmp/transit-live.json transit-live.json
            git add trip-live.json transit-live.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: refresh official trip and transit intelligence"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify deployed v15 build
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node scripts/audit_map_continuity.mjs itinerary-data.js
          grep -q 'LIVE_TRAVEL_V15' index.html
          grep -q 'LIVE_TRAVEL_V15' boot.js
          grep -q 'live-transit-links' boot.js
          grep -q 'transit-live.json' live-transit-links.js
          grep -q 'auditRouteContinuity' stable-tools.js
          grep -q '#route-list \[data-stable-map-event\]' stable-tools.js
          grep -q 'button.textContent="전체 일정"' unified-nav.js
          python -m json.tool transit-live.json >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
