name: Update live trip intelligence

on:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_trip_live.py"
      - "scripts/refine_trip_photos.py"
      - "scripts/update_official_web_content.py"
      - "scripts/update_official_web_content_fast.py"
      - "scripts/fill_official_photo_images.py"
      - "travel-live.js"
      - "unified-nav.js"
      - "unified-experience.js"
      - "unified-experience.css"
      - "hotel-booking-summary.js"
      - "google-maps-inline.js"
      - "google-map-link-bridge.js"
      - "travel-live.css"
      - "google-maps-inline.css"
      - "index.html"
      - "boot.js"
      - ".github/workflows/update-trip-live.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-trip-intelligence-v9
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fare reader
        run: python -m pip install "fast-flights==3.0.1" "typing-extensions>=4.12,<5"

      - name: Syntax checks
        run: |
          python -m py_compile scripts/update_trip_live.py scripts/update_flight_prices.py scripts/refine_trip_photos.py scripts/update_official_web_content.py scripts/update_official_web_content_fast.py scripts/fill_official_photo_images.py
          node --check boot.js
          node --check travel-live.js
          node --check unified-nav.js
          node --check unified-experience.js
          node --check hotel-booking-summary.js
          node --check google-maps-inline.js
          node --check google-map-link-bridge.js

      - name: Validate hotel booking and Google Maps focus behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          maps=Path('google-maps-inline.js').read_text(encoding='utf-8')
          bridge=Path('google-map-link-bridge.js').read_text(encoding='utf-8')
          unified=Path('unified-experience.js').read_text(encoding='utf-8')
          hotels=Path('hotel-booking-summary.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          boot=Path('boot.js').read_text(encoding='utf-8')
          assert 'LIVE_TRAVEL_V9' in boot and 'LIVE_TRAVEL_V9' in html
          assert 'const failures = []' in boot
          assert 'maps/embed/v1/directions' in maps
          assert 'maps/embed/v1/place' in maps
          assert 'trip:map-event' in maps
          assert 'trip:map-place' in maps
          assert 'customView' in maps
          assert 'routeTextParts' in maps
          assert 'renderCustomView' in maps
          assert 'zoom:"17"' in maps
          assert 'map-focused' in Path('unified-experience.css').read_text(encoding='utf-8')
          assert 'preventDefault' in bridge and 'data-inline-google-map' in bridge
          assert 'hotel-booking-summary.js' in boot
          assert '전체 숙박 예약' in hotels
          assert 'Booking 실제 객실·예약/결제' in hotels
          assert 'group_adults:"4"' in hotels
          assert 'no_rooms:String(h.rooms||2)' in hotels
          assert 'unified-experience.css' in html
          assert '항공 · 호텔 · 교통 · 맛집 · 예약 한눈에' in unified
          assert 'Booking 실제 객실·결제' in unified
          assert '실제 메뉴·예약 확인' in unified
          assert 'event-official-weather' in unified
          assert '공식 웹사이트 사진' in unified
          assert 'map-schedule-section' in unified
          assert 'data-map-event-id' in unified
          assert 'target="_blank"' not in maps
          PY

      - name: Refresh fares, stopover and legacy snapshot
        run: |
          python scripts/update_trip_live.py
          python scripts/refine_trip_photos.py

      - name: Replace weather and photos with official web sources
        run: |
          python scripts/update_official_web_content_fast.py
          python scripts/fill_official_photo_images.py

      - name: Validate live snapshot
        run: |
          python -m json.tool trip-live.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('trip-live.json',encoding='utf-8'))
          assert len(p['weather']) == 11
          assert 'return_stopover' in p
          assert p.get('schema_version', 0) >= 5
          assert len(p.get('photos', {})) >= 25
          assert all(photo.get('source') == 'official_website' for photo in p['photos'].values())
          assert sum(bool(photo.get('url')) for photo in p['photos'].values()) >= 19
          assert not any('wikimedia' in (photo.get('url','')+photo.get('page_url','')).lower() for photo in p['photos'].values())
          allowed={'Central Weather Administration (CWA)','KNMI','Deutscher Wetterdienst (DWD)','Danish Meteorological Institute (DMI)','Korea Meteorological Administration (KMA)'}
          for day in p['weather'].values():
              assert day.get('kind') == 'official_weather_bundle'
              for loc in day.get('locations',[]):
                  assert loc.get('authority') in allowed
                  assert loc.get('kind') in {'official_pending','official_hourly','official_unparsed','official_source_error'}
          PY

      - name: Commit refreshed snapshot safely
        run: |
          if git diff --quiet -- trip-live.json; then
            echo "No live changes"
            exit 0
          fi
          cp trip-live.json /tmp/trip-live.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "snapshot push attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/trip-live.json trip-live.json
            git add trip-live.json
            if git diff --cached --quiet; then
              echo "Remote already contains equivalent snapshot"
              exit 0
            fi
            git commit -m "chore: refresh official trip intelligence"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to publish generated snapshot after retries" >&2
          exit 1

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify deployed build
        run: |
          grep -q 'LIVE_TRAVEL_V9' index.html
          grep -q 'LIVE_TRAVEL_V9' boot.js
          grep -q 'hotel-booking-summary.js' boot.js
          grep -q 'customView' google-maps-inline.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4