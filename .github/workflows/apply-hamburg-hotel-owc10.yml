name: Apply Hamburg hotel and OWC 10am update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hamburg-hotel-owc10.yml'
      - 'scripts/apply_hamburg_hotel_owc10.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hotel and meeting update
        run: python3 scripts/apply_hamburg_hotel_owc10.py
      - name: Validate JavaScript and maps
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          cp stable-tools.js /tmp/stable-tools.mjs
          cp report-memo.js /tmp/report-memo.mjs
          cp app.js /tmp/app.mjs
          node --check /tmp/itinerary-data.mjs
          node --check /tmp/stable-tools.mjs
          node --check /tmp/report-memo.mjs
          node --check /tmp/app.mjs
          node --check map-routing.mjs
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node scripts/audit_map_continuity.mjs itinerary-data.js
      - name: Verify booking and Hamburg sequence
        run: |
          grep -q 'Best Western Plus Hotel St. Raphael' itinerary-data.js
          grep -q 'Adenauerallee 41' itinerary-data.js
          grep -q 'rooms: 3' itinerary-data.js
          grep -q '9/8 10:00 요청' itinerary-data.js
          grep -q 'd8-012' itinerary-data.js
          grep -q '08:30~09:40 권고안' itinerary-data.js
          grep -q '10:53 ECE 396 출발' itinerary-data.js
          grep -q '2026-08-20' itinerary-data.js
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-data.js map-routing.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'feat: use booked Hamburg hotel and move OWC to 10am'
            git push
          fi
