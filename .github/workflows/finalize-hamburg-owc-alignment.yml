name: Finalize Hamburg OWC alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-hamburg-owc-alignment.yml'
      - 'scripts/finalize_hamburg_owc_alignment.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final alignment
        run: python3 scripts/finalize_hamburg_owc_alignment.py
      - name: Validate
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          cp stable-tools.js /tmp/stable-tools.mjs
          cp report-memo.js /tmp/report-memo.mjs
          cp timeline-runtime-v17.js /tmp/timeline-runtime-v17.mjs
          cp app.js /tmp/app.mjs
          node --check /tmp/itinerary-data.mjs
          node --check /tmp/stable-tools.mjs
          node --check /tmp/report-memo.mjs
          node --check /tmp/timeline-runtime-v17.mjs
          node --check /tmp/app.mjs
          node --check map-routing.mjs
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node scripts/audit_map_continuity.mjs itinerary-data.js
          ! grep -q 'OWC Alter Wall 69' timeline-runtime-v17.js
          ! grep -q 'Motel One Hamburg-Fleetinsel' map-routing.mjs
          grep -q '"d8-012": "DNV"' report-memo.js
          grep -q '"d9-055": "OWC"' report-memo.js
          grep -q '현지 참석자' report-memo.js
      - name: Commit final alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add map-routing.mjs report-memo.js timeline-runtime-v17.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: align Hamburg and Aarhus map memo details'
            git push
          fi
