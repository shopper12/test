name: Finalize OWC revision safety

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-owc-revision.yml'
      - 'scripts/finalize_owc_revision.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply OWC revision safety fix
        run: python3 scripts/finalize_owc_revision.py
      - name: Validate
        run: |
          cp itinerary-data.js /tmp/itinerary-data.mjs
          cp app.js /tmp/app.mjs
          node --check /tmp/itinerary-data.mjs
          node --check /tmp/app.mjs
          node --check map-routing.mjs
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node scripts/audit_map_continuity.mjs itinerary-data.js
          grep -q 'Christian Apeah 참석 확정 / 날짜·시간·장소 조율 중' itinerary-data.js
          grep -q '${tripMeta.lastVerified}' app.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-data.js map-routing.mjs app.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: keep Hamburg OWC venue provisional and refresh seed revision'
            git push
          fi
