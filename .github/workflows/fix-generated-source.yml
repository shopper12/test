name: Fix generated dashboard source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct generated template expression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          fixed = text.replace(
              'state.activeDay?`Day ${state.activeDay} 경로":"전체 경로"',
              'state.activeDay ? `Day ${state.activeDay} 경로` : "전체 경로"'
          )
          path.write_text(fixed, encoding='utf-8')
          PY
          node --check app.js
          node --check itinerary-data.js
      - name: Commit correction when needed
        run: |
          if git diff --quiet; then
            echo "No correction needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix generated map title expression"
          git push
