name: Apply V17 final verified bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v17-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble verified bundle once
        shell: bash
        run: |
          cat v17part_00_0 v17part_00_1 v17part_01 v17part_02 v17part_03 v17part_04 v17part_05 v17part_06_0 v17part_06_1_0 v17part_06_1_1 v17part_07 > /tmp/v17_bundle.b64
          base64 -d /tmp/v17_bundle.b64 > /tmp/v17_bundle.tar.gz
          gzip -t /tmp/v17_bundle.tar.gz
          tar -tzf /tmp/v17_bundle.tar.gz >/dev/null
          echo "V17 bundle CRC and archive structure OK"

      - name: Apply, verify and push V17 safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          verify_v17() {
            cp itinerary-data.js /tmp/itinerary-data.mjs
            node --check app.js
            node --check boot.js
            node --check map-routing.mjs
            node --check stable-tools.js
            node --check timeline-runtime-v17.js
            node --check unified-experience.js
            node --check travel-live.js
            node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
            node scripts/audit_map_continuity.mjs itinerary-data.js
            python -m py_compile scripts/update_flight_prices.py
            python -m json.tool flight-prices.json >/dev/null
            python - <<'PY'
          import json, re
          from pathlib import Path
          fares=json.load(open('flight-prices.json',encoding='utf-8'))
          assert len(fares.get('fares',{})) == 7, len(fares.get('fares',{}))
          checks=[
            ('Guangzhou',re.compile(r'Guangzhou')),
            ('광저우',re.compile(r'광저우')),
            ('CAN token',re.compile(r'\bCAN\b')),
            ('CZ3098',re.compile(r'CZ3098')),
            ('CZ307',re.compile(r'CZ307')),
            ('csair',re.compile(r'csair',re.I)),
            ('China Southern',re.compile(r'China Southern',re.I)),
            ('route_f2_save',re.compile(r'route_f2_save')),
          ]
          hits=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              for label,pattern in checks:
                  if pattern.search(text): hits.append(f'{p}:{label}')
          assert not hits, hits
          print('Forbidden Guangzhou/CAN references: 0')
          print('Fare routes:',len(fares['fares']))
          PY
          }

          apply_v17() {
            tar -xzf /tmp/v17_bundle.tar.gz
            rm -f \
              timeline-runtime-v16.js v17_bundle.tar.gz \
              v17part_00 v17part_06 \
              v17part_00_0 v17part_00_1 v17part_01 v17part_02 v17part_03 v17part_04 v17part_05 \
              v17part_06_0 v17part_06_1_0 v17part_06_1_1 v17part_07 \
              .github/workflows/apply-v17.yml .github/workflows/apply-v17-final.yml
          }

          for attempt in 1 2 3 4; do
            echo "=== V17 atomic apply attempt ${attempt}/4 ==="
            git fetch origin main
            git reset --hard origin/main
            apply_v17
            verify_v17
            git add -A
            if git diff --cached --quiet; then
              echo "V17 already present on latest main"
              exit 0
            fi
            git commit -m "feat: direct-only itinerary and verified internal map routes"
            if git push origin HEAD:main; then
              echo "V17 push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Remote main changed during attempt ${attempt}; retrying from latest main"
            sleep $((attempt * 2))
          done
          exit 1
