name: Apply V17 verified route bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v17.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply return-flight comparison patch and verify maps
        shell: bash
        run: |
          set -euo pipefail
          git apply --check return-core.patch
          git apply return-core.patch
          rm -rf scripts/__pycache__
          cp itinerary-data.js /tmp/itinerary-data.mjs
          node --check itinerary-data.js
          node --check map-routing.mjs
          node --check travel-live.js
          python -m py_compile scripts/update_flight_prices.py
          rm -rf scripts/__pycache__
          node scripts/verify_map_mappings.mjs /tmp/itinerary-data.mjs
          node scripts/audit_map_continuity.mjs itinerary-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          text='\n'.join(Path(x).read_text(encoding='utf-8') for x in ['itinerary-data.js','map-routing.mjs','travel-live.js','scripts/update_flight_prices.py'])
          banned=[r'광저우',r'Guangzhou',r'중국남방',r'China Southern',r'\bCAN\b',r'CZ3098',r'CZ307',r'csair',r'route_f2_save']
          assert not [(pat,re.search(pat,text,re.I)) for pat in banned if re.search(pat,text,re.I)]
          assert 'CPH→CDG→ICN' in text
          assert 'compare_cph_time' in text
          assert 'Paris Charles de Gaulle Airport' in text
          PY

      - name: Commit verified return comparison
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itinerary-data.js map-routing.mjs travel-live.js scripts/update_flight_prices.py
          git commit -m "feat: compare direct and one-stop return flights in itinerary"
          git push origin HEAD:main
