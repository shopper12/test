<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="2026 해상풍력 벤치마킹 출장 협업 대시보드" />
  <title>해상풍력 벤치마킹 출장 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="brand">
        <h1 id="app-title">해상풍력 벤치마킹 출장 2026</h1>
        <p id="app-route"></p>
      </div>
      <div class="actions no-print">
        <button class="btn small" data-export="csv">CSV</button>
        <button class="btn small" data-export="json">JSON</button>
        <button class="btn small" id="print-btn">인쇄</button>
        <button class="btn small primary" id="cloud-sync-btn" hidden>새 공식안 동기화</button>
        <button class="btn small" id="auth-btn">팀 로그인</button>
      </div>
    </div>
  </header>

  <section class="hero shell">
    <div class="route-title" id="subtitle"></div>
    <div class="stat-grid" id="stat-grid"></div>
    <div class="status-banner" id="status-banner"></div>
  </section>

  <nav class="tabs shell no-print" id="tabs"></nav>
  <main class="shell" id="main-content"></main>

  <footer class="footer shell">
    GitHub Pages 무료 호스팅 · Supabase 로그인/공동편집 · Leaflet/OpenStreetMap 지도<br>
    공개 저장소 기반이므로 여권번호, 연락처, 계약자료 등 비공개 정보는 입력하지 마십시오.
  </footer>

  <div class="modal" id="auth-modal" aria-hidden="true">
    <div class="modal-card">
      <h2>팀원 로그인</h2>
      <p class="auth-note">기존 Lovable 대시보드와 같은 Supabase 계정을 사용합니다. 계정이 없으면 가입 후 이메일 인증이 필요할 수 있습니다.</p>
      <div class="form-grid">
        <div class="field full"><label>이메일</label><input id="auth-email" type="email" autocomplete="email"></div>
        <div class="field full"><label>비밀번호</label><input id="auth-password" type="password" autocomplete="current-password"></div>
      </div>
      <p class="security-note">현재 백엔드의 일부 일정 테이블은 익명 읽기가 허용되어 있습니다. 공개 가능한 출장정보만 입력하십시오.</p>
      <div class="modal-actions">
        <button class="btn" data-close-modal="auth-modal">취소</button>
        <button class="btn" id="signup-btn">가입</button>
        <button class="btn primary" id="login-btn">로그인</button>
      </div>
    </div>
  </div>

  <div class="modal" id="edit-modal" aria-hidden="true">
    <div class="modal-card">
      <h2 id="edit-title">항목 편집</h2>
      <form id="edit-form" class="form-grid"></form>
      <div class="modal-actions">
        <button class="btn danger" id="delete-btn" type="button">삭제</button>
        <button class="btn" data-close-modal="edit-modal" type="button">취소</button>
        <button class="btn primary" id="save-btn" type="button">저장</button>
      </div>
    </div>
  </div>

  <div class="loader" id="loader">처리 중…</div>
  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
